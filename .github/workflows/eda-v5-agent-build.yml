name: EDA V5 Agent Android Build

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/eda-v5-agent-build.yml"
  push:
    branches:
      - eda-v5-agent-integration
    paths:
      - "android-app/**"
      - ".github/workflows/eda-v5-agent-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build EDA V5 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android app
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eda-v5-agent-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
