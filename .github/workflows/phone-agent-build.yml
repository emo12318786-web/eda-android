name: Eda Phone Agent Android build
on:
  push:
    paths:
      - "phone-agent/**"
      - ".github/workflows/phone-agent-build.yml"
  pull_request:
    paths:
      - "phone-agent/**"
      - ".github/workflows/phone-agent-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p phone-agent assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eda-phone-agent-debug
          path: phone-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
