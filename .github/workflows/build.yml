name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Fix whisper-android.aar manifest
        working-directory: android-app
        run: |
          # استخراج، اصلاح، و بازسازی aar
          mkdir -p /tmp/aar_fix
          cd /tmp/aar_fix
          unzip -o $GITHUB_WORKSPACE/android-app/app/libs/whisper-android.aar -d extracted
          # اگر AndroidManifest.xml دارد، package اضافه کن
          if [ -f extracted/AndroidManifest.xml ]; then
            # پاک کردن خط اول و اضافه کردن package
            python3 -c "
import re
with open('extracted/AndroidManifest.xml', 'r') as f:
    content = f.read()
# اگر package ندارد، اضافه کن
if 'package=' not in content:
    content = re.sub(r'<manifest ', '<manifest package=\"com.whisper.android\" ', content, count=1)
with open('extracted/AndroidManifest.xml', 'w') as f:
    f.write(content)
"
          fi
          # بازسازی aar
          cd extracted
          zip -r ../whisper-android-fixed.aar . > /dev/null
          cd ..
          cp whisper-android-fixed.aar $GITHUB_WORKSPACE/android-app/app/libs/whisper-android.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eda-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
