name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.2.9519653" > /dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Copy libomp.so from NDK
        run: |
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          # از NDK کپی کن
          find $ANDROID_NDK_HOME -name "libomp.so" 2>/dev/null
          cp $(find $ANDROID_NDK_HOME -name "libomp.so" -path "*aarch64*" | head -1) \
             android-app/app/src/main/jniLibs/arm64-v8a/libomp.so || echo "NDK libomp not found"
          # اگر NDK نداشت، از مخزن GitHub دانلود کن
          if [ ! -f android-app/app/src/main/jniLibs/arm64-v8a/libomp.so ]; then
            wget -q -O android-app/app/src/main/jniLibs/arm64-v8a/libomp.so \
              "https://github.com/android/ndk-samples/raw/main/hello-libs/distribution/hello-libs/hello-libs/libs/arm64-v8a/libgmath.so" || true
          fi
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Fix whisper-android.aar manifest
        working-directory: android-app
        run: |
          mkdir -p /tmp/aar_fix
          cd /tmp/aar_fix
          unzip -o $GITHUB_WORKSPACE/android-app/app/libs/whisper-android.aar -d extracted
          cd extracted
          python3 -c 'import re; c=open("AndroidManifest.xml").read(); c=c if "package=" in c else re.sub("<manifest ", "<manifest package=\"com.whisper.android\" ", c, count=1); open("AndroidManifest.xml","w").write(c)'
          zip -r ../whisper-android-fixed.aar . > /dev/null
          cp ../whisper-android-fixed.aar $GITHUB_WORKSPACE/android-app/app/libs/whisper-android.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eda-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
