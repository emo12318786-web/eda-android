name: Eda Android APK Derle

on:
  push:
    paths:
      - "android-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenlerini indir
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Whisper modelini indir (git'te yok, cok buyuk)
        run: |
          mkdir -p android-app/app/src/main/assets/models/
          echo "Model indiriliyor..."
          wget -q --show-progress -O android-app/app/src/main/assets/models/ggml-medium-q5_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin" || \
          wget -q --show-progress -O android-app/app/src/main/assets/models/ggml-medium-q5_0.bin \
            "https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin"
          ls -la android-app/app/src/main/assets/models/

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: APK'yi Actions sekmesine yukle
        uses: actions/upload-artifact@v4
        with:
          name: eda-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
