name: Build Android APK

on:
  push:
    branches: [ main, eda-v5-native-gemma-runtime, eda-fix-long-prompt-crash ]
    paths:
      - "android-app/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep one repository-local debug signing identity across CI builds so Android
      # can update the installed APK instead of reporting a signature conflict.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eda-debug-signing-key-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: android-app
        run: |
          echo "=== gradle version ==="
          gradle --version
          echo ""
          echo "=== build ==="
          gradle testStandardDebugUnitTest assembleStandardDebug assemblePreviewDebug --stacktrace --no-daemon

      - name: Upload standard APK (updates matching-signature install)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eda-standard-apk
          path: android-app/app/build/outputs/apk/standard/debug/*.apk
          retention-days: 30

      - name: Upload preview APK (installs alongside existing EDA)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eda-preview-apk
          path: android-app/app/build/outputs/apk/preview/debug/*.apk
          retention-days: 30

