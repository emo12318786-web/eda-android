name: Build Android APK

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/**"
  push:
    branches: [ main, eda-v5-native-gemma-runtime, eda-fix-long-prompt-crash, eda-14-models-visual-fix, restore/build-441-clean-baseline, sherpa-primary-vosk-fallback ]
    paths:
      - "android-app/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report test build revision
        run: |
          echo "Testing commit: $GITHUB_SHA"
          echo "Includes live Health Connect voice reads and native Sherpa/Vosk status rows."
          git log -1 --format="%h %s"

      # Keep one repository-local debug signing identity across CI builds so Android
      # can update the installed APK instead of reporting a signature conflict.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eda-debug-signing-key-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Python for theme asset generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and verify fourteen theme wallpapers
        working-directory: android-app
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.0.0
          python3 -m py_compile generate_theme_backgrounds.py
          python3 generate_theme_backgrounds.py
          BG_COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'bg_theme_*.webp' | wc -l)
          ICON_COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'ic_theme_*.webp' | wc -l)
          echo "Theme backgrounds: $BG_COUNT; theme previews: $ICON_COUNT"
          test "$BG_COUNT" -eq 14
          test "$ICON_COUNT" -eq 14

      - name: Prepare Sherpa-ONNX keyword spotting model
        working-directory: android-app/app/src/main/assets
        run: |
          set -euo pipefail
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          MIRROR="https://huggingface.co/mobilebytesensei/sherpa-onnx-kws-zipformer-gigaspeech-3.3M/resolve/main"
          mkdir -p "$MODEL"
          cd "$MODEL"
          # The upstream GitHub release repeatedly returns HTTP 504 in CI.
          # Download the exact upstream model files from a verified mirror instead.
          fetch() {
            local file="$1" expected="$2"
            curl --fail --location --show-error \
              --connect-timeout 30 --max-time 240 \
              --retry 5 --retry-all-errors --retry-delay 3 \
              "$MIRROR/$file?download=true" -o "$file"
            echo "Downloaded $file: $(wc -c < "$file") bytes"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            echo "Actual SHA-256 for $file: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "Expected SHA-256: $expected"
              return 2
            fi
          }
          fetch "encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "7d5a25fbc14b423074fe0c58e1be388ccf3f1a815c649980232a0c47f81875e4"
          fetch "decoder-epoch-12-avg-2-chunk-16-left-64.onnx" "f61ebd3eed3773a44d088d53dfae92dbb6aec4839f4dcaee2d402414741663a3"
          fetch "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "eae9da0c7e1e6c6a3f4cc42d167899c388f6c6701b94cb96320e4f55df79624c"
          fetch "tokens.txt" "fd2ded4050a55d2b1578870ba8697d02371980217806b7558bd0a5cc60f3ba53"
          fetch "bpe.model" "c8a2a0129c4ab8e463164c142f82d25649661b122c8cd0b7aab5c9e80b90ad24"
          cd ..
          test -s "$MODEL/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "$MODEL/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "$MODEL/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "$MODEL/tokens.txt"
          test -s "$MODEL/bpe.model"
          echo "Sherpa KWS model ready: $(du -sh "$MODEL" | cut -f1)"

      - name: Build Debug APK
        working-directory: android-app
        run: |
          echo "=== gradle version ==="
          gradle --version
          echo ""
          echo "=== build ==="
          gradle testStandardDebugUnitTest assembleStandardDebug assemblePreviewDebug --stacktrace --no-daemon

      - name: Upload standard APK (updates matching-signature install)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eda-standard-apk
          path: android-app/app/build/outputs/apk/standard/debug/*.apk
          retention-days: 30

      - name: Upload preview APK (installs alongside existing EDA)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eda-preview-apk
          path: android-app/app/build/outputs/apk/preview/debug/*.apk
          retention-days: 30

# Rebuild requested after the Gemma 3 1B-only changes.
