name: Eda Android APK Derle

# Sadece android-app/ klasorunde bir degisiklik oldugunda calisir - v2 - v2 - eda.py
# (Termux tarafi) degisince bosuna tetiklenmesin diye.
on:
  push:
    paths:
      - "android-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenlerini indir
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: APK'yi Actions sekmesine yukle
        uses: actions/upload-artifact@v4
        with:
          name: eda-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
